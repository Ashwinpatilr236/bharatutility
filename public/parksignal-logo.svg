<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 630 160" fill="none" width="100%" height="100%">
  <defs>
    <style>
      .ps-text-contrast { fill: #0F172A; }
      .ps-sub-by { fill: #64748B; }
      .ps-tagline { fill: #64748B; }
      @media (prefers-color-scheme: dark) {
        .ps-text-contrast { fill: #FFFFFF; }
        .ps-sub-by { fill: #CBD5E1; }
        .ps-tagline { fill: #94A3B8; }
      }
    </style>

    <!-- Cyan to Electric Blue Gradient for Car & Signal -->
    <linearGradient id="psGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#0066FF" />
    </linearGradient>

    <!-- Signal Arc Gradient -->
    <linearGradient id="psSignalGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0077FE" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>

    <!-- Wordmark Signal Gradient -->
    <linearGradient id="psWordmarkSignal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#0088FF" />
    </linearGradient>

    <!-- BharatUtility Blue Gradient -->
    <linearGradient id="psUtilityGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
  </defs>

  <!-- ==================== EMBLEM / ICON ==================== -->
  <g transform="translate(10, 0)">
    <!-- 1. Radiating Signal Arcs -->
    <!-- Outer Arc -->
    <path d="M 98 46 A 48 48 0 0 1 184 46" fill="none" stroke="url(#psSignalGrad)" stroke-width="7" stroke-linecap="round" />
    <!-- Middle Arc -->
    <path d="M 108 59 A 34 34 0 0 1 174 59" fill="none" stroke="url(#psSignalGrad)" stroke-width="6.5" stroke-linecap="round" />
    <!-- Inner Arc -->
    <path d="M 119 72 A 20 20 0 0 1 163 72" fill="none" stroke="url(#psSignalGrad)" stroke-width="6" stroke-linecap="round" />

    <!-- 2. QR Code Pixel Matrix Blocks (Trailing behind vehicle) -->
    <!-- Corner Locator Block -->
    <rect x="36" y="86" width="26" height="26" rx="4" fill="none" stroke="#00B4D8" stroke-width="4.5" />
    <rect x="44" y="94" width="10" height="10" rx="1.5" fill="#00E5FF" />
    
    <!-- Dissolving Pixel Squares -->
    <rect x="20" y="74" width="9" height="9" rx="1.5" fill="#00B4D8" />
    <rect x="38" y="74" width="9" height="9" rx="1.5" fill="#0077B6" />
    <rect x="18" y="98" width="9" height="9" rx="1.5" fill="#0096C7" />
    <rect x="70" y="84" width="8" height="8" rx="1.5" fill="#00B4D8" />
    <rect x="70" y="98" width="8" height="8" rx="1.5" fill="#023E8A" />
    <rect x="84" y="92" width="7" height="7" rx="1.5" fill="#0077B6" />
    
    <!-- Rear lower accent curve connecting QR to wheel -->
    <path d="M 28 116 C 28 128 38 136 50 136" fill="none" stroke="#0077B6" stroke-width="5" stroke-linecap="round" />

    <!-- 3. Stylized Car Aerodynamic Body Outline -->
    <!-- Cabin Roof, Windshield & Bonnet -->
    <path d="M 166 93 C 182 102 210 106 238 110 C 252 112 258 118 258 126 C 258 132 254 135 244 135" 
          fill="none" stroke="url(#psGradient)" stroke-width="6.5" stroke-linecap="round" />
    
    <!-- Lower Chassis Line between wheels -->
    <line x1="88" y1="135" x2="178" y2="135" stroke="url(#psGradient)" stroke-width="6" stroke-linecap="round" />

    <!-- 4. Wheels (Hollow circular alloy design) -->
    <!-- Rear Wheel -->
    <circle cx="68" cy="135" r="17" fill="none" stroke="url(#psGradient)" stroke-width="6.5" />
    <circle cx="68" cy="135" r="5" fill="#00B4D8" />

    <!-- Front Wheel -->
    <circle cx="204" cy="135" r="17" fill="none" stroke="url(#psGradient)" stroke-width="6.5" />
    <circle cx="204" cy="135" r="5" fill="#00B4D8" />

    <!-- 5. Central Security Shield Emblem (White & Blue Split Highlight) -->
    <g transform="translate(141, 105)">
      <!-- Outer Shield Outline -->
      <path d="M 0 -22 C 14 -22 22 -14 22 -4 C 22 14 6 25 0 29 C -6 25 -22 14 -22 -4 C -22 -14 -14 -22 0 -22 Z" 
            fill="#090D16" stroke="url(#psGradient)" stroke-width="5" stroke-linejoin="round" />
      
      <!-- Left Half Highlight (Pure White) -->
      <path d="M 0 -17 C -10 -17 -16 -10 -16 -2 C -16 11 -4 20 0 24 Z" 
            fill="#FFFFFF" />
      
      <!-- Right Half Highlight (Electric Cyan/Blue) -->
      <path d="M 0 -17 C 10 -17 16 -10 16 -2 C 16 11 4 20 0 24 Z" 
            fill="#0099FF" />
    </g>
  </g>

  <!-- ==================== TYPOGRAPHY / WORDMARK ==================== -->
  <g transform="translate(285, 0)">
    <!-- Main Title: PARKSIGNAL -->
    <text x="0" y="70" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="48" font-weight="900" letter-spacing="1">
      <tspan class="ps-text-contrast">PARK</tspan><tspan fill="url(#psWordmarkSignal)">SIGNAL</tspan>
    </text>

    <!-- Subtitle: by BharatUtility -->
    <text x="2" y="105" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="24" font-weight="700">
      <tspan class="ps-sub-by" font-weight="500">by </tspan>
      <tspan class="ps-text-contrast" font-weight="900">Bharat</tspan>
      <tspan fill="url(#psUtilityGrad)" font-weight="900">Utility</tspan>
    </text>

    <!-- Tagline: Your Vehicle. Your Privacy. -->
    <text x="2" y="134" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" letter-spacing="0.8" class="ps-tagline">
      Your Vehicle. Your Privacy.
    </text>
  </g>
</svg>
