name: Fetch Daily Fuel Prices

on:
  schedule:
    # Run every day at 1:30 AM UTC (7:00 AM IST)
    - cron: '30 1 * * *'
  workflow_dispatch: # Allow manual triggering

jobs:
  update-fuel-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Fetch Script
        run: node scripts/fetch-fuel-prices.mjs

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/fuel-prices.json
          # Only commit if there are changes
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): auto-update daily fuel prices [skip ci]" && git push)
