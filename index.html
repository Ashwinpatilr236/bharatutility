    <script>
      (function() {
        try {
          var theme = localStorage.getItem('bu_theme');
          var isDark = theme === 'dark' || (!theme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) || (theme === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
          var accent = localStorage.getItem('bu_accent') || 'indigo';
          document.documentElement.setAttribute('data-accent', accent);
        } catch (e) {}
      })();
    </script>
